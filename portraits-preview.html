<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Voice — portrait studies</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#f5f4f0;color:#28312f;font:15px/1.5 system-ui,sans-serif}main{max-width:1250px;margin:auto}h1{font-size:30px;font-weight:600;margin:0 0 6px}header p{margin:0 0 32px;color:#65706b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px 20px}figure{margin:0;padding:22px 12px;text-align:center;background:#fff;border-radius:12px}.large{width:180px;height:180px}.sizes{display:flex;justify-content:center;gap:24px;margin:16px 0}.size{display:flex;flex-direction:column;align-items:center;gap:6px}.size span{font-size:11px;color:#79817c}figcaption{font-weight:600}figcaption small{display:block;font-size:12px;font-weight:400;color:#65706b}.avatar{display:block}.avatar .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}.avatar .mouth{transform-box:fill-box;transform-origin:center}.speaking .avatar .mouth{animation:talk .15s ease-in-out infinite alternate}.avatar .steam{animation:steam 2.4s ease-in-out infinite}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}@keyframes talk{from{transform:scaleY(.7)}to{transform:scaleY(1.5)}}@keyframes steam{50%{transform:translateY(-3px);opacity:.25}}button{font:inherit;padding:8px 14px;border:1px solid #bbc5be;border-radius:6px;background:#fff;margin-bottom:24px;cursor:pointer}@media(prefers-reduced-motion:reduce){.avatar .eyes,.avatar .mouth,.avatar .steam{animation:none!important}}
</style>
</head>
<body><main><header><h1>Second Voice · portrait studies</h1><p>Seventeen people, shown at 180, 46 and 42 pixels.</p><button type="button" aria-pressed="false" id="talk">Preview speaking</button></header><div class="grid" id="portraits"></div></main>
<script src="portraits.js"></script>
<script>
const people={gp:['Dr. Amira Patel','Family doctor'],landlord:['Mr. Graham Hollis','Landlord'],garage:['Dave','Mechanic'],luggage:['Priya','Baggage services'],restaurant:['Marco','Waiter'],bank:['Sophie','Bank advisor'],barber:['Jess','Hairdresser'],returns:['Tom','Shop assistant'],party:['Olivia','Neighbour'],meeting:['Rachel','Product manager'],raise:['Simon','Engineering manager'],interview:['Hannah','Interviewer'],witness:['PC Daniel Brooks','Police officer'],sam:['Sam','Old colleague'],hotel:['Hotel receptionist','Reception'],transit:['Taxi driver','Transport'],phone:['Booking receptionist','Phone bookings']};
let n=0;
function portrait(key,size){const uid='preview-'+(++n);return `<svg class="avatar${size===180?' large':''}" viewBox="0 0 160 160" width="${size}" height="${size}" role="img" aria-label="${people[key][0]}"><defs><clipPath id="${uid}"><circle cx="80" cy="80" r="80"/></clipPath></defs><g clip-path="url(#${uid})">${window.SV_PORTRAITS[key](uid)}</g></svg>`;}
document.getElementById('portraits').innerHTML=Object.keys(people).map(key=>`<figure><div style="display:flex;justify-content:center">${portrait(key,180)}</div><div class="sizes">${[46,42].map(size=>`<div class="size">${portrait(key,size)}<span>${size} px</span></div>`).join('')}</div><figcaption>${people[key][0]}<small>${people[key][1]} · ${key}</small></figcaption></figure>`).join('');
document.getElementById('talk').onclick=function(){const active=document.body.classList.toggle('speaking');this.setAttribute('aria-pressed',active);this.textContent=active?'Stop speaking preview':'Preview speaking';};
</script></body></html>
